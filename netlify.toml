# Netlify configuration for the GPX analyzer (Vite + React)
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Pin Node.js version so builds stay reproducible across deploys.
# Vite 5 requires Node 18+. Bumped 20 -> 22 in Phase 11A: Node 20 reached
# end-of-life in April 2026, and @supabase/supabase-js dropped Node 20
# support starting at v2.110.0 (see docs/CLOUD_ARCHITECTURE.md).
[build.environment]
  NODE_VERSION = "22"

# Single-page application: any unknown URL falls back to index.html
# so that deep links / reloads do not 404.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
